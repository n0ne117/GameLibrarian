services:
  gamelibrarian:
    image: ghcr.io/n0ne117/gamelibrarian:latest
    build: .
    container_name: gamelibrarian
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      # Optional: IGDB integration (get credentials at https://dev.twitch.tv)
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
      # Optional: Steam integration (get key at https://steamcommunity.com/dev/apikey)
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - STEAM_WISHLIST_URL=${STEAM_WISHLIST_URL:-}
    restart: always
